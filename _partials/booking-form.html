<form class="booking-form" action="{{formEndpoint}}" method="POST" enctype="multipart/form-data" novalidate>

    <div class="booking-form__grid">
        <div class="field">
            <label for="bf-name">Name <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="bf-name" name="name" autocomplete="name" required>
            <p class="field__error" id="bf-name-error" hidden></p>
        </div>

        <div class="field">
            <label for="bf-company">Company / strata / property name <span class="field__opt">Optional</span></label>
            <input type="text" id="bf-company" name="company" autocomplete="organization">
        </div>

        <div class="field">
            <label for="bf-phone">Phone <span class="req" aria-hidden="true">*</span></label>
            <input type="tel" id="bf-phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="604-555-0142" required>
            <p class="field__error" id="bf-phone-error" hidden></p>
        </div>

        <div class="field">
            <label for="bf-email">Email <span class="req" aria-hidden="true">*</span></label>
            <input type="email" id="bf-email" name="_replyto" inputmode="email" autocomplete="email" required>
            <p class="field__error" id="bf-email-error" hidden></p>
        </div>

        <div class="field field--wide">
            <label for="bf-address">Property address <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="bf-address" name="address" autocomplete="street-address" placeholder="Street address of the property to be tested" required>
            <p class="field__error" id="bf-address-error" hidden></p>
        </div>

        <div class="field">
            <label for="bf-municipality">Municipality <span class="req" aria-hidden="true">*</span></label>
            <select id="bf-municipality" name="municipality" required>
                <option value="">Select…</option>
                {{municipalityOptions}}
                <option value="Other">Other / not listed</option>
            </select>
            <p class="field__error" id="bf-municipality-error" hidden></p>
        </div>

        <div class="field">
            <label for="bf-devices">Number of backflow devices</label>
            <select id="bf-devices" name="devices">
                <option value="">Select…</option>
                {{deviceOptions}}
            </select>
        </div>

        <div class="field field--wide">
            <label for="bf-service">Service needed</label>
            <select id="bf-service" name="service">
                <option value="">Select…</option>
                {{serviceOptions}}
            </select>
        </div>

        <div class="field field--wide">
            <label for="bf-upload">Photo of the device, municipal notice, or previous report <span class="field__opt">Optional</span></label>
            <input type="file" id="bf-upload" name="upload" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf">
            <p class="field__hint">JPG, PNG, or PDF up to 10&nbsp;MB. A photo of the device or your notice is usually enough for us to quote accurately.</p>
            <p class="field__error" id="bf-upload-error" hidden></p>
        </div>

        <div class="field field--wide">
            <label for="bf-notes">Additional notes <span class="field__opt">Optional</span></label>
            <textarea id="bf-notes" name="notes" rows="4" placeholder="Access details, where the device is located, deadlines, or anything else worth knowing."></textarea>
        </div>
    </div>

    <!-- Spam trap. Hidden from people, tempting to bots. -->
    <div class="hp" aria-hidden="true">
        <label for="bf-gotcha">Leave this field empty</label>
        <input type="text" id="bf-gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
    </div>

    <input type="hidden" name="_subject" value="Backflow booking request — eagleeyebackflow.ca">
    <!-- Redirect target for a submission made without JavaScript. -->
    <input type="hidden" name="_next" value="{{siteUrl}}/thank-you.html">

    <div class="booking-form__status" role="status" aria-live="polite" tabindex="-1"></div>

    <div class="booking-form__actions">
        <button type="submit" class="btn btn--primary btn--lg" data-track="form-submit" data-track-location="booking-form">
            Book My Backflow Test
        </button>
        <p class="booking-form__aside">
            Prefer to talk it through? Call or text
            <a href="{{phoneHref}}" data-track="phone-click" data-track-location="booking-form">{{phoneDisplay}}</a>.
        </p>
    </div>
</form>
