<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{robotsTag}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Eagle Eye Backflow Services">
<meta property="og:locale" content="en_CA">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{siteUrl}}/images/og-card.jpg">
<meta property="og:image:alt" content="A backflow prevention assembly — Eagle Eye Backflow Services, certified backflow testing across Greater Vancouver">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{siteUrl}}/images/og-card.jpg">
<meta name="theme-color" content="#06111D">

<!--
    Icons are the Eagle Eye mark (images/logo.png) centred on a white square.
    There is deliberately no SVG icon: browsers prefer an SVG over every PNG
    offered, and the mark is illustrated artwork that has not been vectorised,
    so a stale SVG here would silently override all of these.
-->
<link rel="icon" type="image/png" sizes="32x32" href="{{root}}images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="{{root}}images/icon-192.png">
<link rel="apple-touch-icon" href="{{root}}images/apple-touch-icon.png">

<!--
    Fonts are self-hosted (see fonts/ and the @font-face block in style.css), so
    there is no third-party font request. The two weights that appear above the
    fold are preloaded; the rest are fetched as needed.
-->
<link rel="preload" href="{{root}}fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{root}}fonts/barlow-semicondensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}style.css">
<script src="{{root}}script.js" defer></script>
